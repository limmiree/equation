<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이차방정식 짝 맞추기 (24장)</title>
    <style>
        body { font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f8ff; margin: 20px; }
        h1 { color: #333; margin-bottom: 10px; }
        .info { color: #555; margin-bottom: 20px; font-weight: bold; }
        
        /* 24장용 8x3 그리드 설정 (한 행에 8장) */
        .game-container { 
            display: grid; 
            grid-template-columns: repeat(8, 120px); 
            gap: 12px; 
            max-width: 1100px; /* 화면 밖으로 나가지 않게 조절 */
        }

        .card { width: 120px; height: 150px; perspective: 1000px; cursor: pointer; }
        .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        
        .card-front, .card-back { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; display: flex; 
            align-items: center; justify-content: center; 
            border-radius: 10px; padding: 10px; 
            box-sizing: border-box; font-weight: bold; 
            text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        }
        
        /* 카드 앞면 (하안중 번호) */
        .card-front { background-color: #3498db; color: white; border: 2px solid #2980b9; font-size: 18px; }
        
        /* 카드 뒷면 (이차방정식 내용) */
        .card-back { background-color: white; transform: rotateY(180deg); border: 2px solid #3498db; color: #2c3e50; font-size: 13px; word-break: keep-all; }
        
        /* 맞춘 카드 상태 */
        .matched .card-inner { transform: rotateY(180deg); cursor: default; opacity: 0.5; transition: opacity 0.3s; }
    </style>
</head>
<body>

    <h1>🔢 이차방정식 짝 맞추기 (24장)</h1>
    <p class="info">하안중1 ~ 하안중24 카드 속에서 12쌍의 짝을 찾아보세요!</p>
    
    <div class="game-container" id="gameBoard"></div>

    <script>
        // 12쌍의 데이터 (총 24개)
        const cardData = [
            { pair: 1, content: 'x² - 5x + 6 = 0' }, { pair: 1, content: 'x = 2 또는 3' },
            { pair: 2, content: 'x² - 4 = 0' }, { pair: 2, content: 'x = ±2' },
            { pair: 3, content: 'x² + 2x + 1 = 0' }, { pair: 3, content: 'x = -1 (중근)' },
            { pair: 4, content: 'x² - x - 12 = 0' }, { pair: 4, content: 'x = 4 또는 -3' },
            { pair: 5, content: 'x² - 6x + 9 = 0' }, { pair: 5, content: 'x = 3 (중근)' },
            { pair: 6, content: 'x² + 5x + 4 = 0' }, { pair: 6, content: 'x = -1 또는 -4' },
            { pair: 7, content: 'x² - 7x + 10 = 0' }, { pair: 7, content: 'x = 2 또는 5' },
            { pair: 8, content: 'x² + 3x - 10 = 0' }, { pair: 8, content: 'x = 2 또는 -5' },
            { pair: 9, content: 'x² - 9 = 0' }, { pair: 9, content: 'x = ±3' },
            { pair: 10, content: 'x² - 2x - 8 = 0' }, { pair: 10, content: 'x = 4 또는 -2' },
            { pair: 11, content: 'x² + 6x + 8 = 0' }, { pair: 11, content: 'x = -2 또는 -4' },
            { pair: 12, content: 'x² - 10x + 25 = 0' }, { pair: 12, content: 'x = 5 (중근)' }
        ];

        // 카드 섞기
        const shuffledCards = [...cardData].sort(() => Math.random() - 0.5);
        
        const gameBoard = document.getElementById('gameBoard');
        let flippedCards = [];
        let matchedCount = 0;
        let isChecking = false;

        // 카드 생성
        shuffledCards.forEach((data, index) => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.pair = data.pair;

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">하안중${index + 1}</div>
                    <div class="card-back">${data.content}</div>
                </div>
            `;

            card.addEventListener('click', flipCard);
            gameBoard.appendChild(card);
        });

        function flipCard() {
            if (isChecking || this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                isChecking = true;
                // 두 번째 카드 확인을 위해 1초 대기
                setTimeout(checkMatch, 1000);
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.dataset.pair === card2.dataset.pair) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedCount += 2;
                resetTurn();

                if (matchedCount === cardData.length) {
                    setTimeout(() => alert('대단합니다! 모든 짝을 맞췄습니다!'), 300);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    resetTurn();
                }, 500);
            }
        }

        function resetTurn() {
            flippedCards = [];
            isChecking = false;
        }
    </script>
</body>
</html>
